[package]
name = "asr-overlay"
version = "0.1.0"
description = "OBS overlay that detects speech and generates live subtitles, CPU-only"
authors = ["asr-overlay contributors"]
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["macros", "ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
bytes = "1"

# audio capture
cpal = "0.18"
# resampling
rubato = "0.14"
# audio callbacks → worker threads
crossbeam-channel = "0.5"

# ONNX Runtime — powers both ASR (ARK-ASR INT8) and TTS (Audio8 INT4)
ort = { version = "2.0.0-rc.13", default-features = false, features = [
    "download-binaries",
    "tls-rustls",
] }
# HF tokenizer.json
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
# log-mel frontend (Whisper feature extractor)
rustfft = "6"
# model auto-download
ureq = "3"

# CLI
clap = { version = "4", features = ["derive"] }

# errors
anyhow = "1"

# TTS sampler
rand = "0.9"
rand_chacha = "0.9"

# system tray
tray-icon = "0.20"
gtk = "0.18"
glib = "0.18"
image = "0.25"
open = "5"

# 2D text rendering for the subtitle overlay
cairo-rs = { version = "0.20", features = ["png"] }

# rate limiting
governor = "0.8"
nonzero_ext = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
