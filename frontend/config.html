<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASR Overlay — Settings</title>
    <style>
        :root {
            color-scheme: dark;

            --bg: #090b10;
            --bg-soft: #0d1017;

            --panel: #131822;
            --panel-soft: #171d28;

            --input: #0b0f16;
            --input-hover: #10151e;

            --border: rgba(255, 255, 255, 0.08);
            --border-strong: rgba(255, 255, 255, 0.13);

            --text: #f4f6fb;
            --text-secondary: #c2c8d3;
            --muted: #7f899a;

            --accent: #6d8dff;
            --accent-hover: #809cff;
            --accent-soft: rgba(109, 141, 255, 0.15);

            --success: #56db91;
            --success-soft: rgba(86, 219, 145, 0.13);

            --danger: #ff6b79;

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 14px;

            --shadow:
                0 1px 2px rgba(0, 0, 0, 0.3),
                0 8px 24px rgba(0, 0, 0, 0.16);
        }

        /* =========================
           RESET
        ========================= */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: var(--bg);
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 15% -10%,
                    rgba(79, 111, 255, 0.12),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 100% 0%,
                    rgba(117, 72, 255, 0.07),
                    transparent 35%
                ),
                var(--bg);

            color: var(--text);

            font-family:
                Inter,
                ui-sans-serif,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                sans-serif;

            font-size: 14px;
            line-height: 1.5;

            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            position: sticky;
            top: 0;
            z-index: 100;

            width: 100%;
            min-height: 64px;

            padding: 12px clamp(18px, 2.5vw, 40px);

            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;

            background: rgba(8, 11, 16, 0.92);

            border-bottom: 1px solid var(--border);

            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        header h1 {
            margin: 0;

            color: var(--text);

            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .grow {
            flex: 1;
        }

        /* =========================
           MAIN APP LAYOUT
        ========================= */

        .layout {
            width: 100%;
            max-width: none;
            margin: 0;

            display: grid;

            grid-template-columns:
                clamp(360px, 26vw, 470px)
                minmax(0, 1fr);

            gap: clamp(18px, 2vw, 28px);

            padding:
                clamp(18px, 2.5vw, 36px)
                clamp(18px, 3.5vw, 64px)
                60px;

            align-items: start;
        }

        .layout > div {
            min-width: 0;
        }

        /* Settings column */
        .layout > div:first-child {
            width: 100%;
        }

        /* Preview column */
        .layout > div:last-child {
            width: 100%;

            position: sticky;
            top: 88px;

            align-self: start;
        }

        /* =========================
           PANELS
        ========================= */

        .panel {
            width: 100%;

            padding: 18px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.015),
                    transparent 45%
                ),
                var(--panel);

            border: 1px solid var(--border);

            border-radius: var(--radius-lg);

            box-shadow: var(--shadow);
        }

        .panel + .panel {
            margin-top: 16px;
        }

        .panel h2 {
            margin: 0 0 16px;

            color: var(--text-secondary);

            font-size: 11px;
            font-weight: 700;

            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        /* =========================
           FORM FIELDS
        ========================= */

        .field {
            min-width: 0;
            margin-bottom: 15px;
        }

        .field:last-child {
            margin-bottom: 0;
        }

        .field label {
            display: block;

            margin-bottom: 6px;

            color: var(--text-secondary);

            font-size: 12px;
            font-weight: 600;
        }

        .row {
            display: flex;
            gap: 10px;

            width: 100%;
        }

        .row > * {
            flex: 1 1 0;
            min-width: 0;
        }

        /* =========================
           INPUTS
        ========================= */

        input[type="text"],
        input[type="number"],
        select,
        textarea {
            display: block;

            width: 100%;
            min-width: 0;

            padding: 9px 10px;

            color: var(--text);

            background: var(--input);

            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);

            outline: none;

            transition:
                background 140ms ease,
                border-color 140ms ease,
                box-shadow 140ms ease;
        }

        input[type="text"]:hover,
        input[type="number"]:hover,
        select:hover,
        textarea:hover {
            background: var(--input-hover);

            border-color: rgba(255, 255, 255, 0.17);
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus,
        textarea:focus {
            border-color: var(--accent);

            box-shadow:
                0 0 0 3px var(--accent-soft);
        }

        input::placeholder,
        textarea::placeholder {
            color: #555f70;
        }

        input[type="number"] {
            appearance: textfield;
            -moz-appearance: textfield;
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            margin: 0;
            -webkit-appearance: none;
        }

        /* =========================
           SELECT
        ========================= */

        select {
            cursor: pointer;
        }

        /* =========================
           TEXTAREA
        ========================= */

        textarea {
            min-height: 120px;

            resize: vertical;

            font-family:
                "SFMono-Regular",
                Consolas,
                "Liberation Mono",
                monospace;

            font-size: 12px;
            line-height: 1.55;
        }

        /* =========================
           COLOR
        ========================= */

        input[type="color"] {
            width: 100%;
            height: 38px;

            padding: 3px;

            cursor: pointer;

            background: var(--input);

            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch {
            border: 0;
            border-radius: 5px;
        }

        input[type="color"]::-moz-color-swatch {
            border: 0;
            border-radius: 5px;
        }

        /* =========================
           RANGE
        ========================= */

        input[type="range"] {
            width: 100%;

            margin: 8px 0 0;

            cursor: pointer;

            accent-color: var(--accent);
        }

        /* =========================
           CHECKBOX
        ========================= */

        .inline {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .inline input[type="checkbox"] {
            width: 16px;
            height: 16px;

            margin: 0;

            cursor: pointer;

            accent-color: var(--accent);
        }

        .inline label {
            margin: 0 !important;
            cursor: pointer;
        }

        /* =========================
           BUTTONS
        ========================= */

        button {
            min-height: 36px;

            padding: 8px 14px;

            color: #fff;

            background:
                linear-gradient(
                    180deg,
                    rgba(255, 255, 255, 0.07),
                    transparent
                ),
                var(--accent);

            border: 1px solid rgba(255, 255, 255, 0.09);

            border-radius: var(--radius-sm);

            font-size: 13px;
            font-weight: 650;

            cursor: pointer;

            box-shadow:
                0 1px 2px rgba(0, 0, 0, 0.32),
                inset 0 1px rgba(255, 255, 255, 0.06);

            transition:
                transform 120ms ease,
                background 140ms ease,
                border-color 140ms ease,
                box-shadow 140ms ease;
        }

        button:hover {
            background:
                linear-gradient(
                    180deg,
                    rgba(255, 255, 255, 0.09),
                    transparent
                ),
                var(--accent-hover);

            box-shadow:
                0 4px 15px rgba(76, 101, 205, 0.25),
                inset 0 1px rgba(255, 255, 255, 0.08);
        }

        button:active {
            transform: translateY(1px);
        }

        button:focus-visible {
            outline: none;

            box-shadow:
                0 0 0 3px var(--accent-soft);
        }

        button.secondary {
            color: var(--text-secondary);

            background: rgba(255, 255, 255, 0.055);

            border: 1px solid var(--border-strong);

            box-shadow: none;
        }

        button.secondary:hover {
            color: var(--text);

            background: rgba(255, 255, 255, 0.09);

            border-color: rgba(255, 255, 255, 0.18);

            box-shadow: none;
        }

        button:disabled {
            opacity: 0.45;

            cursor: default;

            transform: none;
        }

        /* =========================
           HINTS
        ========================= */

        .hint {
            margin: -6px 0 13px;

            color: var(--muted);

            font-size: 11.5px;
            line-height: 1.5;
        }

        code {
            padding: 2px 5px;

            color: #b8c5ff;

            background: rgba(255, 255, 255, 0.055);

            border: 1px solid var(--border);
            border-radius: 5px;

            font-family:
                "SFMono-Regular",
                Consolas,
                monospace;

            font-size: 0.9em;
        }

        /* =========================
           PILLS / STATUS
        ========================= */

        .pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-height: 25px;

            padding: 3px 9px;

            color: var(--muted);

            background: rgba(255, 255, 255, 0.055);

            border: 1px solid var(--border);

            border-radius: 999px;

            font-size: 11px;
            font-weight: 600;

            white-space: nowrap;
        }

        .pill.live {
            color: var(--success);

            background: var(--success-soft);

            border-color: rgba(86, 219, 145, 0.22);
        }

        .pill.live::before {
            content: "";

            width: 6px;
            height: 6px;

            margin-right: 6px;

            background: currentColor;

            border-radius: 50%;

            box-shadow: 0 0 8px currentColor;
        }

        /* =========================
           PREVIEW TOOLBAR
        ========================= */

        .stage-bar {
            display: flex;
            align-items: center;

            gap: 8px;

            width: 100%;

            margin-bottom: 12px;
            padding-bottom: 12px;

            border-bottom: 1px solid var(--border);
        }

        .stage-bar input[type="text"] {
            flex: 1 1 auto;

            min-width: 150px;
        }

        .stage-bar button,
        .stage-bar .pill {
            flex: 0 0 auto;
        }

        /* =========================
           PREVIEW PANEL
        ========================= */

        #preview-stage {
            position: relative;

            width: 100%;

            height: clamp(
                430px,
                calc(100vh - 245px),
                820px
            );

            min-height: 430px;

            overflow: hidden;

            border: 1px solid var(--border-strong);

            border-radius: var(--radius-md);

            background-color: #16191f;

            background-image:
                linear-gradient(
                    45deg,
                    rgba(255, 255, 255, 0.025) 25%,
                    transparent 25%
                ),
                linear-gradient(
                    -45deg,
                    rgba(255, 255, 255, 0.025) 25%,
                    transparent 25%
                ),
                linear-gradient(
                    45deg,
                    transparent 75%,
                    rgba(255, 255, 255, 0.025) 75%
                ),
                linear-gradient(
                    -45deg,
                    transparent 75%,
                    rgba(255, 255, 255, 0.025) 75%
                );

            background-size: 24px 24px;

            background-position:
                0 0,
                0 12px,
                12px -12px,
                -12px 0;

            box-shadow:
                inset 0 0 0 1px rgba(0, 0, 0, 0.18),
                inset 0 -80px 120px rgba(0, 0, 0, 0.08);
        }

        #preview-stage::after {
            content: "";

            position: absolute;
            inset: 0;

            pointer-events: none;

            border-radius: inherit;

            box-shadow:
                inset 0 1px rgba(255, 255, 255, 0.04);
        }

        #preview-stage.photo {
            background-image:
                linear-gradient(
                    135deg,
                    #31527c 0%,
                    #69517c 48%,
                    #ad725c 100%
                );

            background-size: cover;
        }

        /* Preview caption needs to stay above overlay */
        #preview-caption {
            z-index: 1;
        }

        /* =========================
           OBS URL AREA
        ========================= */

        #overlay-url {
            word-break: break-all;
        }

        /* =========================
           LARGE DISPLAYS
        ========================= */

        @media (min-width: 1600px) {
            .layout {
                grid-template-columns:
                    clamp(400px, 24vw, 520px)
                    minmax(0, 1fr);

                gap: clamp(24px, 2vw, 36px);

                padding-left: clamp(30px, 4vw, 80px);
                padding-right: clamp(30px, 4vw, 80px);
            }

            #preview-stage {
                height: clamp(
                    520px,
                    calc(100vh - 230px),
                    900px
                );
            }
        }

        /* Very large / zoomed-out browser */
        @media (min-width: 2200px) {
            .layout {
                grid-template-columns:
                    clamp(440px, 22vw, 600px)
                    minmax(0, 1fr);

                padding-left: clamp(50px, 5vw, 140px);
                padding-right: clamp(50px, 5vw, 140px);
            }

            .panel {
                padding: 20px;
            }
        }

        /* =========================
           MEDIUM SCREENS
        ========================= */

        @media (max-width: 1100px) {
            .layout {
                grid-template-columns:
                    minmax(320px, 390px)
                    minmax(0, 1fr);

                gap: 16px;

                padding: 16px;
            }

            .layout > div:last-child {
                top: 80px;
            }

            #preview-stage {
                min-height: 380px;

                height: calc(100vh - 230px);
            }
        }

        /* =========================
           TABLET / SMALL WINDOWS
        ========================= */

        @media (max-width: 800px) {
            .layout {
                grid-template-columns: 1fr;

                padding: 14px;
            }

            .layout > div:last-child {
                position: static;

                margin-top: 16px;
            }

            #preview-stage {
                height: 480px;
                min-height: 340px;
            }
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 520px) {
            header {
                padding: 10px 12px;
            }

            .layout {
                padding: 12px;
            }

            .panel {
                padding: 15px;
            }

            .row {
                flex-direction: column;

                gap: 0;
            }

            .stage-bar {
                align-items: stretch;
            }

            .stage-bar input[type="text"] {
                flex-basis: 100%;

                width: 100%;
            }

            #preview-stage {
                height: 380px;
                min-height: 300px;
            }
        }

        /* =========================
           SCROLLBARS
        ========================= */

        * {
            scrollbar-width: thin;

            scrollbar-color:
                rgba(255, 255, 255, 0.16)
                transparent;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.14);

            border-radius: 999px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.22);
        }

        /* =========================
           TEXT SELECTION
        ========================= */

        ::selection {
            color: #fff;

            background: rgba(109, 141, 255, 0.35);
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="/src/config/main.ts"></script>
</body>
</html>
