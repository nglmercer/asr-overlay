<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASR Overlay</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
        }
        #status {
            position: absolute;
            top: 8px;
            right: 12px;
            font-family: monospace;
            font-size: 12px;
            color: rgba(255,255,255,0.6);
            text-shadow: 0 1px 2px #000;
            display: none;
        }
        #status.live { color: rgba(80,255,120,0.9); }
    </style>
</head>
<body>
    <!-- Static pre-render of the overlay: identical to what the Vue app
         renders, so the first paint and non-JS fetches see the caption. -->
    <div id="app">
        <!-- The caption is plain DOM text, not an image: style it with the config
             page, or with your own CSS in an OBS Browser Source. -->
        <div id="caption"><span class="caption-text"></span></div>
        <div id="status">connecting…</div>
    </div>
    <script type="module" src="/src/overlay/main.ts"></script>
</body>
</html>
